<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LaFabrik — Visionneuse 3D</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/src/demo/demo.css">
</head>
<body>
  <header class="top">
    <strong>LaFabrik</strong><span class="muted">Visionneuse 3D · prototype local</span>
    <nav><a href="editor.html">Mode édition</a><a href="demo-fiche-produit.html">Exemple fiche produit</a></nav>
  </header>

  <main class="layout">
    <section class="viewer-col">
      <div class="viewer-wrap" id="wrap">
        <lafabrik-viewer id="viewer" autoload alt="Cadre en relief"></lafabrik-viewer>
        <div class="overlay" id="overlay" hidden><img id="overlay-img" alt="Photographie de référence"></div>
      </div>
    </section>

    <aside class="panel">
      <label class="field">Produit
        <select id="product"></select>
      </label>
      <h1 id="title">—</h1>
      <p class="muted small" id="status">Chargement…</p>

      <h2>Comparer avec une photo</h2>
      <p class="muted small">Choisissez une photographie du vrai cadre : la vue 3D prend le même angle et la photo se superpose.</p>
      <div class="photos" id="photos"></div>
      <label class="file">Ouvrir une photo locale…<input type="file" id="photo-file" accept="image/*"></label>
      <div id="compare-controls" hidden>
        <label class="field">Opacité de la photo <input type="range" id="op" min="0" max="1" step="0.01" value="0.5"></label>
        <label class="field">Volet (glisser pour révéler) <input type="range" id="wipe" min="0" max="100" step="1" value="100"></label>
        <label class="field">Échelle photo <input type="range" id="ps" min="0.5" max="2" step="0.005" value="1"></label>
        <div class="row">
          <label class="field">Décalage X <input type="range" id="px" min="-50" max="50" step="0.1" value="0"></label>
          <label class="field">Décalage Y <input type="range" id="py" min="-50" max="50" step="0.1" value="0"></label>
        </div>
        <div class="row">
          <button type="button" id="snap">Capture 3D (PNG)</button>
          <button type="button" id="close-compare">Fermer la comparaison</button>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="/src/demo/demo.js"></script>
</body>
</html>
