name: Mise à jour hebdomadaire de l'index de recettes

on:
  schedule:
    # Chaque lundi à 04h10 UTC — hors heures de pointe, une seule fois par
    # semaine (voir docs/COOKIDOO_RESEARCH.md pour la justification de cette
    # fréquence : on évite de solliciter cookidoo.fr plus que nécessaire).
    - cron: '10 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  # Nécessaire pour déclencher le workflow de déploiement ci-dessous : un
  # push effectué avec le GITHUB_TOKEN par défaut ne redéclenche jamais
  # automatiquement les autres workflows (protection anti-boucle de GitHub),
  # donc sans ça le site resterait figé après chaque mise à jour de l'index.
  actions: write

concurrency:
  group: update-recipes
  cancel-in-progress: false

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer data/recipes-fr.json
        run: node scripts/update-recipes.mjs

      - name: Committer si l'index a changé
        id: commit
        run: |
          if git diff --quiet -- data/recipes-fr.json data/recipes-fr.compact.json data/index-state.json; then
            echo "Aucun changement dans l'index de recettes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recipes-fr.json data/recipes-fr.compact.json data/index-state.json
          git commit -m "chore: mise à jour hebdomadaire de l'index de recettes"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Déclencher le déploiement GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
